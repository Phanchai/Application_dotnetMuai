name: CI

on:
  push:
    branches: [main, remake]
  pull_request:

jobs:
  test-and-web:
    name: Tests + web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Unit and component tests
        run: dotnet test tests/RdTracker.Tests -c Release
      - name: Publish the WebAssembly demo
        run: dotnet publish src/RdTracker.Web -c Release -o publish

  android:
    name: Android build (MAUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 21
      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android
      - name: Build
        run: dotnet build src/RdTracker.App -c Release -f net10.0-android
